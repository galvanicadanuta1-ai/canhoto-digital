<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Registro de Retrabalho - Galvânica Danuta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 40px; }
        .container { max-width: 500px; margin: auto; padding: 15px; box-sizing: border-box; position: relative; }
        .btn-voltar-topo { position: absolute; top: 15px; right: 15px; color: #e74c3c; text-decoration: none; font-weight: bold; }
        
        .topo { display: flex; align-items: center; background: #fff; padding: 10px 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logo-topo img { height: 30px; }
        .titulo-topo { flex: 1; text-align: center; color: #ff0000; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-right: 40px; }

        .secao-titulo { font-size: 13px; font-weight: bold; color: #555; margin-top: 15px; display: block; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; margin-top: 5px; background: white; }
        
        .hidden { display: none; }
        .btn-scan { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; background: #2c3e50; color: white; }
        .btn-manual { background: #ebf0f5; color: #444; padding: 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; display: inline-block; margin-top: 5px; font-weight: 600; cursor: pointer; }
        
        .badge-container { background: #fff; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px dashed #ff0000; min-height: 40px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-item { background: #fdedec; color: #ff0000; border: 1px solid #ff0000; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }

        .area-foto { margin-top: 10px; text-align: center; }
        .btn-camera-nativa { 
            background: #e74c3c; 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            display: block; 
            width: 100%; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            border: 2px solid #c0392b;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        #preview { width: 100%; border-radius: 12px; margin-top: 10px; display: none; border: 2px solid #ccc; }

        .btnSalvar { background: #ff0000; color: white; margin-top: 30px; font-size: 18px; font-weight: bold; width: 100%; padding: 18px; border: none; border-radius: 12px; border-bottom: 5px solid #b30000; cursor: pointer; }

        /* AJUSTE DA TELA DO SCANNER PARA MOSTRAR A MIRA */
        #scannerTela { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 9999; }
        #reader { width: 100% !important; height: 100% !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <a href="menu-qualidade.html" class="btn-voltar-topo">< Voltar</a>
    <div class="topo">
        <div class="logo-topo"><img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png"></div>
        <div class="titulo-topo">Registro de Retrabalho</div>
    </div>

    <label class="secao-titulo">Data</label>
    <input type="date" id="dataRetrabalho">

    <label class="secao-titulo">Nome do Cliente</label>
    <select id="clienteSel" onchange="verificarOutro(this.value)">
        <option value="">Selecione o Cliente</option>
        <option value="Fixpar">Fixpar</option>
        <option value="Macrosul">Macrosul</option>
        <option value="Outro">Outro...</option>
    </select>
    <input type="text" id="clienteOutro" class="hidden" placeholder="Digite o nome do Cliente">

    <label class="secao-titulo">Ordem de Serviço (OS)</label>
    <button class="btn-scan" onclick="abrirScanner()">📷 ESCANEAR OS</button>
    <div class="btn-manual" onclick="addManual()">+ Digitar OS Manualmente</div>
    <div class="badge-container" id="contOS"></div>

    <div class="grid-2">
        <div>
            <label class="secao-titulo">Lote</label>
            <select id="loteSel"><option value="Total">Total</option><option value="Parcial">Parcial</option></select>
        </div>
        <div>
            <label class="secao-titulo">Turno que Produziu</label>
            <select id="turnoSel"><option value="Dia">Dia</option><option value="Noite">Noite</option><option value="Ambos Turnos">Ambos Turnos</option></select>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label class="secao-titulo">Quantidade</label>
            <div style="display:flex; gap:5px">
                <input type="number" id="qtd" placeholder="Qtd">
                <select id="unidade" style="width: 120px"><option value="Peças">Peças</option><option value="Volume">Volume</option></select>
            </div>
        </div>
        <div><label class="secao-titulo">Kgs</label><input type="number" id="kgs" placeholder="Peso"></div>
    </div>

    <label class="secao-titulo">Causa do Retrabalho</label>
    <textarea id="causa" rows="2" placeholder="Descreva o motivo..."></textarea>

    <label class="secao-titulo">Registro Fotográfico (Obrigatório)</label>
    <div class="area-foto">
        <label for="fotoInput" class="btn-camera-nativa">📸 ABRIR CÂMERA</label>
        <input type="file" id="fotoInput" accept="image/*,video/*" capture="environment" class="hidden" onchange="exibirPreview(this)">
        <img id="preview" src="">
    </div>

    <label class="secao-titulo">Qual Plano de Ação</label>
    <textarea id="plano" rows="2" placeholder="O que será feito?"></textarea>

    <button class="btnSalvar" id="btnSalvar" onclick="salvar()">REGISTRAR RETRABALHO</button>
</div>

<div id="scannerTela">
    <div id="reader"></div>
    <div style="position:absolute; bottom:40px; width:100%; text-align:center; z-index:10001;">
        <button onclick="fecharScanner()" style="width:80%; background:#e74c3c; color:white; padding:15px; border-radius:10px; font-weight:bold; border:none;">CANCELAR</button>
    </div>
</div>

<script>
let scanner; let listaOS = []; let base64Image = "";
const apiUrl = "https://script.google.com/macros/s/AKfycbxOseaVN67HO0UMyGpHoWqCX1llA0uazVeI4xvUha7TYF7UNL-Jnwc-LIWBfmmzce9LlA/exec";

window.onload = () => { document.getElementById('dataRetrabalho').valueAsDate = new Date(); };

function verificarOutro(val) {
    const inputOutro = document.getElementById('clienteOutro');
    val === 'Outro' ? inputOutro.classList.remove('hidden') : inputOutro.classList.add('hidden');
}

function exibirPreview(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            base64Image = e.target.result;
            const prev = document.getElementById('preview');
            prev.src = e.target.result;
            prev.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// FUNÇÃO DO SCANNER COM MIRA (LINHA VERMELHA)
function abrirScanner() {
    document.getElementById("scannerTela").style.display = "block";
    // Forçando a exibição da mira de leitura
    scanner = new Html5Qrcode("reader", { verbose: false });
    const config = { 
        fps: 20, 
        qrbox: { width: 250, height: 150 }, // Define a área de foco
        aspectRatio: 1.0 
    };

    scanner.start(
        { facingMode: "environment" }, 
        config, 
        (codigo) => {
            adicionarValor(codigo); 
            fecharScanner();
        }
    ).catch(() => alert("Erro ao abrir scanner. Verifique as permissões."));
}

function fecharScanner() { 
    if (scanner) { 
        scanner.stop().then(() => { 
            document.getElementById("scannerTela").style.display = "none"; 
        }).catch(() => {
            document.getElementById("scannerTela").style.display = "none";
        }); 
    } 
}

function addManual() { let n = prompt("Digite o número da OS:"); if (n) adicionarValor(n); }
function adicionarValor(val) { if (!val || listaOS.includes(val)) return; listaOS.push(val); atualizarExibicao(); }
function removerItem(val) { listaOS = listaOS.filter(i => i !== val); atualizarExibicao(); }
function atualizarExibicao() { document.getElementById('contOS').innerHTML = listaOS.map(i => `<div class="badge-item" onclick="removerItem('${i}')">OS: ${i} X</div>`).join(''); }

function salvar() {
    const clienteBase = document.getElementById("clienteSel").value;
    const clienteFinal = clienteBase === 'Outro' ? document.getElementById("clienteOutro").value.trim() : clienteBase;
    const data = document.getElementById("dataRetrabalho").value;
    const qtd = document.getElementById("qtd").value;
    const causa = document.getElementById("causa").value.trim();

    if (!clienteFinal || listaOS.length === 0 || !qtd || !base64Image || !causa) {
        alert("⚠️ Preencha os campos obrigatórios e tire a foto!"); return;
    }

    const btn = document.getElementById("btnSalvar");
    btn.disabled = true; btn.innerText = "ENVIANDO AGUARDE...";

    const payload = {
        tipo: "RETRABALHO",
        data: data,
        cliente: clienteFinal,
        ordens: listaOS,
        lote: document.getElementById("loteSel").value,
        quantidade: qtd + " " + document.getElementById("unidade").value,
        kgs: document.getElementById("kgs").value,
        turno: document.getElementById("turnoSel").value,
        causa: causa,
        plano: document.getElementById("plano").value.trim(),
        foto: base64Image
    };

    fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
    .then(() => { alert("✅ Registro de Retrabalho Salvo!"); location.reload(); })
    .catch(() => { alert("❌ Erro ao salvar."); btn.disabled = false; });
}
</script>
</body>
</html>
