<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Envio Fixpar - Galvânica Danuta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 40px; }
        .container { max-width: 500px; margin: auto; padding: 15px; box-sizing: border-box; position: relative; }
        .btn-voltar { position: absolute; top: 15px; right: 15px; color: #e74c3c; text-decoration: none; font-weight: bold; font-size: 14px; }
        .topo { display: flex; align-items: center; background: #fff; padding: 10px 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logo-topo img { height: 30px; }
        .titulo-topo { flex: 1; text-align: center; color: #ff0000; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-right: 40px; }
        .secao-titulo { font-size: 12px; font-weight: bold; color: #555; margin-top: 12px; display: block; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; margin-top: 5px; background: white; }
        .btn-scan { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; background: #2c3e50; color: white; }
        .btn-manual { background: #ebf0f5; color: #444; padding: 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; display: inline-block; margin-top: 5px; font-weight: 600; cursor: pointer; }
        .badge-container { background: #fff; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px dashed #0f4c81; min-height: 40px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-item { background: #e1f5fe; color: #01579b; border: 1px solid #01579b; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .btnSalvar { background: #25D366; color: white; margin-top: 25px; font-size: 18px; font-weight: bold; width: 100%; padding: 18px; border: none; border-radius: 12px; border-bottom: 5px solid #1da851; cursor: pointer; text-transform: uppercase; }
        #scannerTela { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 9999; }
        #reader { width: 100% !important; height: 100% !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; gap: 5px; }
        .input-group input { flex: 1; }
        .input-group select { width: 120px; }
    </style>
</head>
<body>

<div class="container">
    <a href="javascript:history.back()" class="btn-voltar">< Voltar</a>
    <div class="topo">
        <div class="logo-topo"><img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png"></div>
        <div class="titulo-topo">Canhoto Digital</div>
    </div>

    <h2 style="text-align:center; color:#333; font-size: 16px; margin-top: 0;">ENVIO FIXPAR</h2>

    <div class="grid-2">
        <div><label class="secao-titulo">Data</label><input type="date" id="dataEnvio"></div>
        <div><label class="secao-titulo">Hora</label><input type="time" id="horaEnvio"></div>
    </div>

    <label class="secao-titulo">Número da Ordem (OS)</label>
    <button class="btn-scan" onclick="abrirScanner()">📷 ESCANEAR ORDEM DE SERVIÇO</button>
    <div class="btn-manual" onclick="addManual()">+ Digitar OS Manualmente</div>
    <div class="badge-container" id="contOS"></div>

    <div class="grid-2">
        <div>
            <label class="secao-titulo">Quantidade</label>
            <div class="input-group">
                <input type="number" id="qtdValor" placeholder="0">
                <select id="qtdUnidade">
                    <option value="Caixas">Caixas</option>
                    <option value="Caçambas">Caçambas</option>
                </select>
            </div>
        </div>
        <div><label class="secao-titulo">Peso Total (Kgs)</label><input type="number" id="kgs" placeholder="0.00"></div>
    </div>

    <label class="secao-titulo">Cor do Acabamento</label>
    <select id="corSel">
        <option value="">Selecione a Cor...</option>
        <option value="Zincado Branco">Zincado Branco</option>
        <option value="Zincado Amarelo">Zincado Amarelo</option>
        <option value="Zincado Preto">Zincado Preto</option>
        <option value="Bicromatizado">Bicromatizado</option>
        <option value="Galvanizado a Fogo">Galvanizado a Fogo</option>
        <option value="Outra">Outra...</option>
    </select>

    <button class="btnSalvar" id="btnSalvar" onclick="salvar()">Salvar e Enviar</button>
</div>

<div id="scannerTela">
    <div id="reader"></div>
    <div style="position:absolute; bottom:40px; width:100%; text-align:center; z-index:10001;">
        <button onclick="fecharScanner()" style="width:80%; background:#e74c3c; color:white; padding:15px; border-radius:10px; font-weight:bold; border:none;">FECHAR</button>
    </div>
</div>

<script>
let scanner; let listaOS = [];
// --- COLOQUE SUA URL DO GOOGLE APPS SCRIPT ABAIXO ---
const apiUrl = "SUA_URL_AQUI"; 

window.onload = () => { 
    const agora = new Date();
    document.getElementById('dataEnvio').valueAsDate = agora;
    document.getElementById('horaEnvio').value = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
};

function abrirScanner() {
    document.getElementById("scannerTela").style.display = "block";
    scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (c) => { 
        if(!listaOS.includes(c)) { listaOS.push(c); atualizarExibicao(); }
        fecharScanner();
    });
}

function fecharScanner() { if (scanner) { scanner.stop().then(() => { document.getElementById("scannerTela").style.display = "none"; }); } }
function addManual() { let n = prompt("Digite o número da OS:"); if (n && !listaOS.includes(n)) { listaOS.push(n); atualizarExibicao(); } }
function removerItem(val) { listaOS = listaOS.filter(i => i !== val); atualizarExibicao(); }
function atualizarExibicao() { document.getElementById('contOS').innerHTML = listaOS.map(i => `<div class="badge-item" onclick="removerItem('${i}')">OS: ${i} X</div>`).join(''); }

function salvar() {
    const data = document.getElementById("dataEnvio").value;
    const hora = document.getElementById("horaEnvio").value;
    const qtd = document.getElementById("qtdValor").value;
    const unidade = document.getElementById("qtdUnidade").value;
    const kgs = document.getElementById("kgs").value;
    const cor = document.getElementById("corSel").value;

    if (listaOS.length === 0 || !qtd || !kgs || !cor) { 
        alert("⚠️ Preencha todos os campos!"); return; 
    }

    const btn = document.getElementById("btnSalvar");
    btn.disabled = true; btn.innerText = "SALVANDO...";

    const payload = {
        tipo: "ENVIO_FIXPAR",
        data: data,
        hora: hora,
        ordens: listaOS,
        qtd: qtd + " " + unidade,
        kgs: kgs,
        cor: cor
    };

    fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
    .then(() => {
        // --- WHATSAPP CONFIGURADO ---
        const numeroZap = "5554984042504"; 
        
        let msg = `*ENVIO FIXPAR* 🏭\n`;
        msg += `📅 ${data.split('-').reverse().join('/')} - ⏰ ${hora}\n`;
        msg += `------------------------------\n`;
        
        listaOS.forEach(os => {
            msg += `📦 *Ordem:* ${os}\n`;
            msg += `🔢 *Qtd:* ${qtd} ${unidade}\n`;
            msg += `⚖️ *Peso:* ${kgs} Kgs\n`;
            msg += `🎨 *Cor:* ${cor}\n`;
            msg += `------------------------------\n`;
        });

        window.location.href = `https://wa.me/${numeroZap}?text=${encodeURIComponent(msg)}`;
        setTimeout(() => { location.reload(); }, 2000);
    })
    .catch(() => { 
        alert("Erro ao salvar."); 
        btn.disabled = false;
        btn.innerText = "Salvar e Enviar";
    });
}
</script>
</body>
</html>
