<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Galvânica Danuta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 90%; max-width: 400px; text-align: center; background: white; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo { width: 220px; margin-bottom: 40px; }
        .btn-home { display: flex; align-items: center; justify-content: center; width: 100%; padding: 22px 0; margin-bottom: 15px; font-size: 18px; font-weight: bold; color: white; text-decoration: none; border-radius: 12px; border: none; cursor: pointer; transition: transform 0.1s ease; box-sizing: border-box; text-transform: uppercase; }
        
        /* Cores e Bordas dos Botões na Sequência Correta */
        .btn-rec { background-color: #16a34a; border-bottom: 5px solid #14532d; } /* Recebimento */
        .btn-pro { background-color: #4f46e5; border-bottom: 5px solid #3730a3; } /* Produção (Nova Cor) */
        .btn-exp { background-color: #0f4c81; border-bottom: 5px solid #082d4d; } /* Expedição */
        .btn-qua { background-color: #334155; border-bottom: 5px solid #1e293b; } /* Qualidade */
        
        .btn-home:active { transform: translateY(3px); border-bottom-width: 2px; }
        .footer { margin-top: 25px; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo">
        
        <!-- 1. RECEBIMENTO -->
        <a href="menu-recebimento.html" class="btn-home btn-rec">📥 RECEBIMENTO</a>

        <!-- 2. PRODUÇÃO -->
        <a href="menu-producao.html" class="btn-home btn-pro">⚙️ PRODUÇÃO</a>

        <!-- 3. QUALIDADE -->
        <a href="menu-qualidade.html" class="btn-home btn-qua">🛡️ QUALIDADE</a>

        <!-- 4. EXPEDIÇÃO -->
        <a href="menu-expedicao.html" class="btn-home btn-exp">📦 EXPEDIÇÃO</a>
        
        <div class="footer">
            Galvânica Danuta &copy; 2026<br>By Marcelo Dallabarba
        </div>
    </div>
</body>
</html>
