<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Galvânica Danuta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 90%; max-width: 400px; text-align: center; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo { width: 180px; margin-bottom: 20px; }
        h1 { color: #0f4c81; font-size: 22px; margin-bottom: 30px; text-transform: uppercase; }
        .btn-home { display: flex; align-items: center; justify-content: center; width: 100%; padding: 25px 0; margin-bottom: 15px; font-size: 20px; font-weight: bold; color: white; text-decoration: none; border-radius: 12px; transition: 0.2s; border: none; cursor: pointer; }
        .btn-exp { background-color: #0f4c81; border-bottom: 5px solid #082d4d; }
        .btn-qua { background-color: #64748b; border-bottom: 5px solid #475569; } /* Cinza por enquanto */
        .btn-home:active { transform: translateY(3px); border-bottom-width: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo">
        <h1>Sistema Interno</h1>
        
        <a href="menu-expedicao.html" class="btn-home btn-exp">📦 EXPEDIÇÃO</a>
        
        <button class="btn-home btn-qua" onclick="alert('Módulo em desenvolvimento')">🛡️ QUALIDADE</button>
