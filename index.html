<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Galvânica Danuta</title>
    <style>
        /* Estilos para centralizar e organizar a tela */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: #f1f5f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }

        .container { 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }

        .logo { 
            width: 220px; 
            margin-bottom: 40px; 
        }

        /* Estilo dos Botões Grandes da Home */
        .btn-home { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 25px 0; 
            margin-bottom: 15px; 
            font-size: 20px; 
            font-weight: bold; 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.1s ease;
            box-sizing: border-box;
        }

        /* Cor Azul para Expedição */
        .btn-exp { 
            background-color: #0f4c81; 
            border-bottom: 5px solid #082d4d; 
        }

        /* Cor Cinza Azulado para Qualidade */
        .btn-qua { 
            background-color: #334155; 
            border-bottom: 5px solid #1e293b; 
        }

        .btn-home:active { 
            transform: translateY(3px); 
            border-bottom-width: 2px; 
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo">
        
        <a href="menu-expedicao.html" class="btn-home btn-exp">
            📦 EXPEDIÇÃO
        </a>
        
        <a href="menu-qualidade.html" class="btn-home btn-qua">
            🛡️ QUALIDADE
        </a>

        <div class="footer">
            Galvânica Danuta © 2026
        </div>
    </div>

</body>
</html>
