<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produção - Galvânica Danuta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 90%; max-width: 400px; text-align: center; background: white; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo { width: 220px; margin-bottom: 40px; }
        .btn-menu { display: flex; align-items: center; justify-content: center; width: 100%; padding: 25px 0; margin-bottom: 20px; font-size: 18px; font-weight: bold; color: white; text-decoration: none; border-radius: 12px; border: none; cursor: pointer; transition: transform 0.1s ease; box-sizing: border-box; text-transform: uppercase; }
        
        /* Cor do Botão de Apontamento */
        .btn-apontamento { background-color: #4f46e5; border-bottom: 5px solid #3730a3; }
        
        /* Botão Voltar Profissional e Sem Exageros */
        .btn-voltar { display: inline-block; margin-top: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; color: #64748b; text-decoration: none; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; transition: background 0.2s; }
        .btn-voltar:active { background: #f8fafc; }
        
        .btn-menu:active { transform: translateY(3px); border-bottom-width: 2px; }
        .footer { margin-top: 25px; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo">
        
        <a href="apontamento-os.html" class="btn-menu btn-apontamento">⚙️ Apontamento de OS</a>
        
        <a href="index.html" class="btn-voltar">Reset</a>
        
        <div class="footer">
            Galvânica Danuta &copy; 2026<br>By Marcelo Dallabarba
        </div>
    </div>
</body>
</html>
