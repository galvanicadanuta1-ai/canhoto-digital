<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Recebimento - Galvânica Danuta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 40px; }
        .container { max-width: 500px; margin: auto; padding: 15px; box-sizing: border-box; position: relative; }
        .btn-voltar { position: absolute; top: 15px; right: 15px; color: #64748b; text-decoration: none; font-weight: bold; font-size: 14px; }
        .topo { display: flex; align-items: center; background: #fff; padding: 10px 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logo-topo img { height: 30px; }
        .titulo-topo { flex: 1; text-align: center; color: #16a34a; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-right: 40px; }
        .secao-titulo { font-size: 13px; font-weight: bold; color: #555; margin-top: 15px; display: block; }
        .obrigatorio { color: #dc2626; font-weight: bold; margin-left: 3px; }
        
        /* Padronização de inputs e caixas de seleção */
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; margin-top: 5px; background: #fff; }
        
        .btn-scan { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; background: #16a34a; color: white; cursor: pointer; }
        .btn-manual { background: #ebf0f5; color: #444; padding: 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; display: inline-block; margin-top: 5px; font-weight: 600; cursor: pointer; }
        .badge-container { background: #fff; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px dashed #16a34a; min-height: 45px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-item { background: #e8f5e9; color: #1b5e20; border: 1px solid #1b5e20; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        
        /* Botões de Seleção OK / NOK do Lote */
        .btn-lote { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; transition: all 0.2s; }
        .btn-ok-ativo { background: #27ae60 !important; color: white !important; border-color: #27ae60 !important; }
        .btn-nok-ativo { background: #c0392b !important; color: white !important; border-color: #c0392b !important; }

        .btnSalvar { background: #27ae60; color: white; margin-top: 25px; font-size: 18px; font-weight: bold; width: 100%; padding: 18px; border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
        #scannerTela { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 9999; }
        #reader { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="btn-voltar">< Voltar</a>

    <div class="topo">
        <div class="logo-topo"><img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png"></div>
        <div class="titulo-topo">Recebimento</div>
    </div>
    
    <label class="secao-titulo">Data de Recebimento</label>
    <input type="date" id="dataRecebimento">

    <label class="secao-titulo">Ordem de Serviço (OS)<span class="obrigatorio">*</span></label>
    <button class="btn-scan" onclick="abrirScanner()">📷 ESCANEAR ORDEM DE SERVIÇO</button>
    <div class="btn-manual" onclick="addManual()">+ Digitar OS Manualmente</div>
    <div class="badge-container" id="contOS"></div>

    <label class="secao-titulo">Nome do Cliente<span class="obrigatorio">*</span></label>
    <input type="text" id="nomeCliente" placeholder="Digite o nome do cliente">

    <label class="secao-titulo">N° Nota Fiscal</label>
    <input type="text" id="notaFiscal" placeholder="Digite o número da Nota Fiscal">

    <label class="secao-titulo">OP do Cliente</label>
    <input type="text" id="opCliente" placeholder="Digite a OP do Cliente">

    <label class="secao-titulo">Cromato<span class="obrigatorio">*</span></label>
    <select id="cromato" onchange="verificarCromato(this.value)">
        <option value="">-- Selecione o Cromato --</option>
        <option value="Azul Trivalente (Branco)">Azul Trivalente (Branco)</option>
        <option value="Amarelo Hexavalente">Amarelo Hexavalente</option>
        <option value="Amarelo Trivalente">Amarelo Trivalente</option>
        <option value="Preto">Preto</option>
        <option value="Verde Oliva">Verde Oliva</option>
        <option value="Outro">Outro</option>
    </select>
    <input type="text" id="cromatoOutro" placeholder="Digite o tipo de Cromato*" style="display: none; margin-top: 8px;">

    <label class="secao-titulo">Linha de Banho<span class="obrigatorio">*</span></label>
    <select id="linhaBanho">
        <option value="">-- Selecione a Linha --</option>
        <option value="Parado">Parado</option>
        <option value="Rotativo">Rotativo</option>
    </select>

    <div style="display: flex; gap: 10px; margin-top: 5px;">
        <div style="flex: 1;">
            <label class="secao-titulo" style="margin-top: 10px;">Qtd.<span class="obrigatorio">*</span></label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="quantidade" placeholder="Apenas números" style="margin-top: 5px;">
        </div>
        <div style="flex: 1;">
            <label class="secao-titulo" style="margin-top: 10px;">Volumes<span class="obrigatorio">*</span></label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="volumes" placeholder="Apenas números" style="margin-top: 5px;">
        </div>
    </div>

    <label class="secao-titulo">Kgs<span class="obrigatorio">*</span></label>
    <input type="number" inputmode="decimal" step="0.01" id="kgs" placeholder="Digite o peso (Apenas números)">

    <label class="secao-titulo">Lote Aprovado?<span class="obrigatorio">*</span></label>
    <div style="display: flex; gap: 10px; margin-top: 5px;">
        <button type="button" id="loteOK" class="btn-lote" onclick="selecionarLote('OK')" style="color: #27ae60;">OK</button>
        <button type="button" id="loteNOK" class="btn-lote" onclick="selecionarLote('NOK')" style="color: #c0392b;">NOK</button>
    </div>

    <div id="boxMotivo" style="display: none; margin-top: 10px;">
        <label class="secao-titulo">Motivo Reprovação<span class="obrigatorio">*</span></label>
        <input type="text" id="motivoReprovacao" placeholder="Digite o motivo da reprovação">
    </div>

    <label class="secao-titulo">Fotografia do Recebimento<span class="obrigatorio">*</span></label>
    <button type="button" class="btn-scan" style="background: #7f8c8d;" onclick="document.getElementById('fotoInput').click()">📷 REGISTRAR FOTOGRAFIA</button>
    <input type="file" accept="image/*" capture="environment" id="fotoInput" style="display: none;" onchange="capturarFoto(this)">
    
    <div id="previewContainer" style="display: none; text-align: center; margin-top: 10px;">
        <img id="imgPreview" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #ccc;">
    </div>

    <button class="btnSalvar" id="btnSalvar" onclick="salvar()">SALVAR RECEBIMENTO</button>
</div>

<div id="scannerTela"><div id="reader"></div><div style="position:absolute; bottom:40px; width:100%; text-align:center;"><button onclick="fecharScanner()" style="width:80%; background:#e74c3c; color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">FECHAR</button></div></div>

<script>
let scanner; let listaOS = []; let statusLote = ""; let fotoBase64 = "";
const apiUrl = "https://script.google.com/macros/s/AKfycbxw42iHfUghqkeunSGbU5syHFXJGsTHHvNT5GXm56jXOV-UPdlnebvxjxPvsIsbwcccxA/exec";

window.onload = () => { 
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const dia = String(hoje.getDate()).padStart(2, '0');
    document.getElementById('dataRecebimento').value = `${ano}-${mes}-${dia}`;
};

function abrirScanner() {
    document.getElementById("scannerTela").style.display = "block";
    scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (c) => { 
        if(!listaOS.includes(c)) { listaOS.push(c); atualizarExibicao(); }
        fecharScanner();
    });
}

function fecharScanner() { if (scanner) { scanner.stop().then(() => { document.getElementById("scannerTela").style.display = "none"; }); } }
function addManual() { let n = prompt("Digite o número da OS:"); if (n && !listaOS.includes(n)) { listaOS.push(n); atualizarExibicao(); } }
function removerItem(val) { listaOS = listaOS.filter(i => i !== val); atualizarExibicao(); }
function atualizarExibicao() { document.getElementById('contOS').innerHTML = listaOS.map(i => `<div class="badge-item" onclick="removerItem('${i}')">OS: ${i} X</div>`).join(''); }

function verificarCromato(val) {
    const campoOutro = document.getElementById("cromatoOutro");
    if (val === "Outro") {
        campoOutro.style.display = "block";
        campoOutro.focus();
    } else {
        campoOutro.style.display = "none";
        campoOutro.value = "";
    }
}

function selecionarLote(opcao) {
    statusLote = opcao;
    const btnOK = document.getElementById("loteOK");
    const btnNOK = document.getElementById("loteNOK");
    const boxMotivo = document.getElementById("boxMotivo");

    if (opcao === "OK") {
        btnOK.classList.add("btn-ok-ativo");
        btnNOK.classList.remove("btn-nok-ativo");
        boxMotivo.style.display = "none";
        document.getElementById("motivoReprovacao").value = "";
    } else {
        btnNOK.classList.add("btn-nok-ativo");
        btnOK.classList.remove("btn-ok-ativo");
        boxMotivo.style.display = "block";
    }
}

function capturarFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            fotoBase64 = e.target.result;
            document.getElementById("imgPreview").src = e.target.result;
            document.getElementById("previewContainer").style.display = "block";
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function salvar() {
    const cli = document.getElementById("nomeCliente").value.trim();
    const nf = document.getElementById("notaFiscal").value.trim();
    const op = document.getElementById("opCliente").value.trim();
    const cromatoSel = document.getElementById("cromato").value;
    const cromatoOutroValor = document.getElementById("cromatoOutro").value.trim();
    const cromatoFinal = cromatoSel === "Outro" ? cromatoOutroValor : cromatoSel;
    const linha = document.getElementById("linhaBanho").value;
    const qtd = document.getElementById("quantidade").value;
    const vols = document.getElementById("volumes").value;
    const peso = document.getElementById("kgs").value;
    const motivo = document.getElementById("motivoReprovacao").value.trim();

    // VALIDAÇÕES OBRIGATÓRIAS COM ALERTAS ESPECÍFICOS
    if (listaOS.length === 0) { alert("⚠️ Campo Obrigatório: Escaneie ou digite ao menos uma Ordem de Serviço (OS)!"); return; }
    if (!cli) { alert("⚠️ Campo Obrigatório: Digite o Nome do Cliente!"); document.getElementById("nomeCliente").focus(); return; }
    if (!cromatoSel) { alert("⚠️ Campo Obrigatório: Selecione o Cromato!"); document.getElementById("cromato").focus(); return; }
    if (cromatoSel === "Outro" && !cromatoOutroValor) { alert("⚠️ Campo Obrigatório: Especifique o tipo de Cromato!"); document.getElementById("cromatoOutro").focus(); return; }
    if (!linha) { alert("⚠️ Campo Obrigatório: Selecione a Linha de Banho!"); document.getElementById("linhaBanho").focus(); return; }
    if (!qtd || isNaN(qtd)) { alert("⚠️ Campo Obrigatório: Digite uma Quantidade válida!"); document.getElementById("quantidade").focus(); return; }
    if (!vols || isNaN(vols)) { alert("⚠️ Campo Obrigatório: Digite um Volume válido!"); document.getElementById("volumes").focus(); return; }
    if (!peso || isNaN(peso)) { alert("⚠️ Campo Obrigatório: Digite o peso em Kgs válido!"); document.getElementById("kgs").focus(); return; }
    if (!statusLote) { alert("⚠️ Campo Obrigatório: Selecione se o Lote foi Aprovado (OK ou NOK)!"); return; }
    if (statusLote === "NOK" && !motivo) { alert("⚠️ Campo Obrigatório: Digite o Motivo da Reprovação!"); document.getElementById("motivoReprovacao").focus(); return; }
    if (!fotoBase64) { alert("⚠️ Campo Obrigatório: Você precisa Registrar a Fotografia do lote!"); return; }
    
    const btn = document.getElementById("btnSalvar"); 
    btn.disabled = true; 
    btn.innerText = "SALVANDO RECEBIMENTO...";
    
    const payload = { 
        tipo: "RECEBIMENTO", 
        data: document.getElementById("dataRecebimento").value, 
        cliente: cli,
        notaFiscal: nf,
        opCliente: op,
        cromato: cromatoFinal,
        linhaBanho: linha,
        quantidade: qtd,
        volumes: vols,
        kgs: peso,
        loteAprovado: statusLote,
        motivoReprovacao: statusLote === "NOK" ? motivo : "",
        ordens: listaOS,
        foto: fotoBase64
    };
    
    fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
    .then(() => { 
        alert("✅ Recebimento registrado e salvo com sucesso!");
        location.reload(); 
    })
    .catch(() => {
        alert("❌ Erro de comunicação ao salvar o recebimento.");
        btn.disabled = false;
        btn.innerText = "SALVAR RECEBIMENTO";
    });
}
</script>
</body>
</html>
