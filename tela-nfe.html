<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Canhoto Digital - Galvânica Danuta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 40px; }
        .container { max-width: 500px; margin: auto; padding: 15px; box-sizing: border-box; position: relative; }
        
        .topo { display: flex; align-items: center; background: #fff; padding: 10px 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logo-topo img { height: 30px; }
        .titulo-topo { flex: 1; text-align: center; color: #0f4c81; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-right: 40px; }
        
        .secao-titulo { font-size: 13px; font-weight: bold; color: #555; margin-top: 15px; display: block; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; margin-top: 5px; }
        
        .btn-scan { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; background: #2c3e50; color: white; }
        .btn-manual { background: #ebf0f5; color: #444; padding: 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; display: inline-block; margin-top: 5px; font-weight: 600; cursor: pointer; }
        
        .badge-container { background: #fff; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px dashed #0f4c81; min-height: 45px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-item { background: #e1f5fe; color: #01579b; border: 1px solid #01579b; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        
        .btnSalvar { background: #27ae60; color: white; margin-top: 25px; font-size: 18px; font-weight: bold; width: 100%; padding: 18px; border: none; border-radius: 12px; cursor: pointer; }
        
        #scannerTela { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 9999; }
        #reader { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="topo">
        <div class="logo-topo"><img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png"></div>
        <div class="titulo-topo">Canhoto Digital</div>
    </div>

    <label class="secao-titulo">Notas Fiscais (DANFE)</label>
    <button class="btn-scan" onclick="abrirScanner('NF')">📷 ESCANEAR NOTA FISCAL</button>
    <div class="btn-manual" onclick="addManual('NF')">+ Digitar Nota Manual</div>
    <div class="badge-container" id="contNF"></div>

    <label class="secao-titulo">Ordens de Serviço Danuta</label>
    <button class="btn-scan" onclick="abrirScanner('OS')">📷 ESCANEAR ORDEM DE SERVIÇO</button>
    <div class="btn-manual" onclick="addManual('OS')">+ Digitar OS Manual</div>
    <div class="badge-container" id="contOS"></div>

    <label class="secao-titulo">Nome Completo (Recebedor)</label>
    <input type="text" id="recebedor" placeholder="Nome do destinatário">

    <label class="secao-titulo">Documento (RG ou CPF)</label>
    <input type="text" id="documento">

    <button class="btnSalvar" id="btnSalvar" onclick="proximaEtapa()">PRÓXIMO: ASSINATURA</button>
</div>

<div id="scannerTela">
    <div id="reader"></div>
    <div style="position:absolute; bottom:40px; width:100%; text-align:center; z-index:10001;">
        <button onclick="fecharScanner()" style="width:80%; background:#e74c3c; color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">FECHAR</button>
    </div>
</div>

<script>
let scanner; let listaNF = []; let listaOS = []; let tipoAtual = "";

function abrirScanner(tipo) {
    tipoAtual = tipo; 
    document.getElementById("scannerTela").style.display = "block";
    
    if (!scanner) {
        scanner = new Html5Qrcode("reader");
    }

    // Código de inicialização idêntico ao da tela de retrabalho que funciona
    scanner.start(
        { facingMode: "environment" }, 
        { fps: 30, qrbox: 250 }, 
        (c) => { 
            processarCodigoLido(c);
            fecharScanner();
        }
    ).catch(err => {
        console.error("Erro ao abrir a câmera:", err);
    });
}

function processarCodigoLido(texto) {
    if (tipoAtual === 'NF') {
        if (!listaNF.includes(texto)) {
            listaNF.push(texto);
            atualizarExibicao('contNF', listaNF);
        }
    } else {
        if (!listaOS.includes(texto)) {
            listaOS.push(texto);
            atualizarExibicao('contOS', listaOS);
        }
    }
}

function fecharScanner() { if (scanner) { scanner.stop().then(() => { document.getElementById("scannerTela").style.display = "none"; }); } }
function addManual(tipo) { let n = prompt("Digite o número:"); if (n) { if (tipo === 'NF') { if(!listaNF.includes(n)) listaNF.push(n); atualizarExibicao('contNF', listaNF); } else { if(!listaOS.includes(n)) listaOS.push(n); atualizarExibicao('contOS', listaOS); } } }
function atualizarExibicao(id, lista) { document.getElementById(id).innerHTML = lista.map(i => `<div class="badge-item" onclick="removerItem('${id}', '${i}')">${i} ✕</div>`).join(''); }
function removerItem(id, valor) { if (id === 'contNF') { listaNF = listaNF.filter(v => v !== valor); atualizarExibicao('contNF', listaNF); } else { listaOS = listaOS.filter(v => v !== valor); atualizarExibicao('contOS', listaOS); } }

function proximaEtapa() {
    if (listaNF.length === 0 || !document.getElementById('recebedor').value) { alert("Preencha as Notas e o Nome do Recebedor!"); return; }
    localStorage.setItem("dadosEntrega", JSON.stringify({
        notas: listaNF,
        ordens: listaOS,
        recebedor: document.getElementById('recebedor').value,
        documento: document.getElementById('documento').value
    }));
    window.location.href = "tela-assinatura.html";
}
</script>
</body>
</html>
