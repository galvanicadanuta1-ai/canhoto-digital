<script>

let scanner;
let listaNF = [];
let listaOS = [];
let destino = 'NF';
let assinou = false;

const apiUrl = "https://script.google.com/macros/s/AKfycbw3S7HM-KQnZFd38NRh2J-OYIIsNMstsBfXOY6Q9yxeoNQPVRev4uKOSZq-aSRE1L9fWA/exec";

function mascaraCPF(i) {

    let v = i.value.replace(/\D/g, "");

    if (v.length > 11) {
        v = v.slice(0, 11);
    }

    i.value = v.replace(
        /(\d{3})(\d{3})(\d{3})(\d{2})/,
        "$1.$2.$3-$4"
    );
}

function validarCPF(cpf) {

    cpf = cpf.replace(/[^\d]+/g, '');

    if (
        cpf == '' ||
        cpf.length != 11 ||
        /^(\d)\1{10}$/.test(cpf)
    ) {
        return false;
    }

    let add = 0;

    for (let i = 0; i < 9; i++) {
        add += parseInt(cpf.charAt(i)) * (10 - i);
    }

    let rev = 11 - (add % 11);

    if (rev == 10 || rev == 11) {
        rev = 0;
    }

    if (rev != parseInt(cpf.charAt(9))) {
        return false;
    }

    add = 0;

    for (let i = 0; i < 10; i++) {
        add += parseInt(cpf.charAt(i)) * (11 - i);
    }

    rev = 11 - (add % 11);

    if (rev == 10 || rev == 11) {
        rev = 0;
    }

    if (rev != parseInt(cpf.charAt(10))) {
        return false;
    }

    return true;
}

function abrirScanner(tipo) {

    destino = tipo;

    document.getElementById("scannerTela").style.display = "block";

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 30,
            qrbox: { width: 300, height: 150 },
            aspectRatio: 1.77
        },
        (codigo) => {

            let n = codigo.replace(/\D/g, '');

            let num =
                (tipo === 'NF' && n.length >= 34)
                ? n.substring(25, 34)
                : n;

            adicionarValor(num);

            fecharScanner();
        }
    ).catch(() => {

        alert("Câmera não disponível.");

    });
}

function fecharScanner() {

    if (scanner) {

        scanner.stop().then(() => {

            document.getElementById("scannerTela").style.display = "none";

        });
    }
}

function addManual(tipo) {

    destino = tipo;

    let n = prompt(
        tipo === 'NF'
        ? "Digite o número da NF:"
        : "Digite a Identificação da OS:"
    );

    if (n) {

        let valor =
            (tipo === 'NF')
            ? n.replace(/\D/g, '')
            : n.trim();

        adicionarValor(valor);
    }
}

function adicionarValor(val) {

    if (!val) return;

    if (destino === 'NF') {

        if (!listaNF.includes(val)) {
            listaNF.push(val);
        }

    } else {

        if (!listaOS.includes(val)) {
            listaOS.push(val);
        }
    }

    atualizarExibicao();
}

function removerItem(tipo, val) {

    if (tipo === 'NF') {

        listaNF = listaNF.filter(i => i !== val);

    } else {

        listaOS = listaOS.filter(i => i !== val);
    }

    atualizarExibicao();
}

function atualizarExibicao() {

    document.getElementById('contNF').innerHTML =
        listaNF.map(i =>
            `<div class="badge-item" onclick="removerItem('NF', '${i}')">NF: ${i} <span class="btn-excluir-item">X</span></div>`
        ).join('');

    document.getElementById('contOS').innerHTML =
        listaOS.map(i =>
            `<div class="badge-item" onclick="removerItem('OS', '${i}')">OS: ${i} <span class="btn-excluir-item">X</span></div>`
        ).join('');
}

const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");

function ajustarCanvas() {

    canvas.width = canvas.offsetWidth;
    canvas.height = 200;
}

window.addEventListener("load", ajustarCanvas);

let desenhando = false;

function obterPosicao(e) {

    const rect = canvas.getBoundingClientRect();

    const cx = e.touches
        ? e.touches[0].clientX
        : e.clientX;

    const cy = e.touches
        ? e.touches[0].clientY
        : e.clientY;

    return {
        x: cx - rect.left,
        y: cy - rect.top
    };
}

function iniciar(e) {

    e.preventDefault();

    desenhando = true;

    assinou = true;

    ctx.beginPath();

    const p = obterPosicao(e);

    ctx.moveTo(p.x, p.y);
}

function mover(e) {

    if (!desenhando) return;

    e.preventDefault();

    const p = obterPosicao(e);

    ctx.lineTo(p.x, p.y);

    ctx.lineWidth = 3;

    ctx.stroke();
}

canvas.addEventListener("touchstart", iniciar, {passive: false});
canvas.addEventListener("touchmove", mover, {passive: false});
canvas.addEventListener("touchend", () => desenhando = false);

canvas.addEventListener("mousedown", iniciar);
canvas.addEventListener("mousemove", mover);

window.addEventListener("mouseup", () => desenhando = false);

function limparAss() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    assinou = false;
}

function salvar() {

    const r = document.getElementById("recebedor").value.trim();
    const d = document.getElementById("rgcpf").value.trim();
    const x = document.getElementById("expedidor").value.trim();

    if (r.split(' ').filter(word => word.length > 0).length < 2) {

        alert("⚠️ Digite o NOME COMPLETO de quem recebeu.");

        return;
    }

    if (!validarCPF(d)) {

        alert("⚠️ CPF INVÁLIDO. Por favor, digite um número real.");

        return;
    }

    if (
        !r ||
        !d ||
        !x ||
        listaNF.length === 0 ||
        listaOS.length === 0 ||
        !assinou
    ) {

        alert("⚠️ Preencha todos os campos corretamente e assine o quadro.");

        return;
    }

    const btn = document.getElementById("btnSalvar");

    btn.disabled = true;

    btn.innerText = "ENVIANDO...";

    fetch(apiUrl, {

        method: "POST",

        mode: "no-cors",

        body: JSON.stringify({
            notas: listaNF,
            ordens: listaOS,
            recebedor: r,
            documento: d,
            expedidor: x,
            assinatura: canvas.toDataURL("image/png")
        })

    })

    .then(() => {

        alert("✅ Canhoto enviado com sucesso!");

        location.reload(true);

    })

    .catch(error => {

        alert("❌ Erro na conexão.");

        btn.disabled = false;

        btn.innerText = "SALVAR";

        console.error(error);
    });
}

</script>
