<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canhoto Digital</title>

<style>

body{
font-family:Arial;
max-width:500px;
margin:auto;
padding:20px;
background:#f0f2f5;
}

input,button{
width:100%;
padding:14px;
margin-top:10px;
box-sizing:border-box;
}

button{
background:#0f4c81;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

#assinatura{
border:2px solid #0f4c81;
width:100%;
height:200px;
background:#fff;
margin-top:10px;
touch-action:none;
}

.badge{
background:#fff;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

</style>
</head>

<body>

<h2>Canhoto Digital</h2>

<button onclick="addManual('NF')">
Adicionar NF
</button>

<div id="contNF"></div>

<input id="recebedor" placeholder="Recebedor">

<input id="rgcpf" placeholder="CPF">

<button onclick="addManual('OS')">
Adicionar OS
</button>

<div id="contOS"></div>

<input id="expedidor" placeholder="Expedidor">

<canvas id="assinatura"></canvas>

<button onclick="limparAss()">
Limpar Assinatura
</button>

<button id="btnSalvar" onclick="salvar()">
SALVAR
</button>

<script>

const apiUrl="https://script.google.com/macros/s/AKfycbw3S7HM-KQnZFd38NRh2J-OYIIsNMstsBfXOY6Q9yxeoNQPVRev4uKOSZq-aSRE1L9fWA/exec";

let listaNF=[];
let listaOS=[];
let destino='NF';
let assinou=false;

function addManual(tipo){

destino=tipo;

let valor=prompt("Digite:");

if(!valor)return;

if(tipo==="NF"){
listaNF.push(valor);
}else{
listaOS.push(valor);
}

render();
}

function render(){

document.getElementById("contNF").innerHTML=
listaNF.map(n=>`<div class="badge">NF: ${n}</div>`).join('');

document.getElementById("contOS").innerHTML=
listaOS.map(n=>`<div class="badge">OS: ${n}</div>`).join('');
}

const canvas=document.getElementById("assinatura");
const ctx=canvas.getContext("2d");

canvas.width=canvas.offsetWidth;
canvas.height=200;

let desenhando=false;

function pos(e){

const r=canvas.getBoundingClientRect();

return{
x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,
y:(e.touches?e.touches[0].clientY:e.clientY)-r.top
};
}

function start(e){

desenhando=true;
assinou=true;

ctx.beginPath();

const p=pos(e);

ctx.moveTo(p.x,p.y);
}

function move(e){

if(!desenhando)return;

e.preventDefault();

const p=pos(e);

ctx.lineTo(p.x,p.y);

ctx.lineWidth=3;

ctx.stroke();
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
window.addEventListener("mouseup",()=>desenhando=false);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",move,{passive:false});
canvas.addEventListener("touchend",()=>desenhando=false);

function limparAss(){

ctx.clearRect(0,0,canvas.width,canvas.height);

assinou=false;
}

function salvar(){

const payload={

notas:listaNF,
ordens:listaOS,
recebedor:document.getElementById("recebedor").value,
documento:document.getElementById("rgcpf").value,
expedidor:document.getElementById("expedidor").value,
assinatura:canvas.toDataURL("image/png")

};

const xhr=new XMLHttpRequest();

xhr.open("POST",apiUrl,true);

xhr.setRequestHeader(
"Content-Type",
"application/json"
);

xhr.onreadystatechange=function(){

if(xhr.readyState===4){

if(xhr.status===200){

alert("✅ Enviado com sucesso");

location.reload();

}else{

alert("❌ Erro ao enviar");
console.log(xhr.responseText);

}
}
};

xhr.send(JSON.stringify(payload));
}

</script>

</body>
</html>
