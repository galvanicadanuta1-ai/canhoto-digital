<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Canhoto Digital - Galvânica Danuta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* TEMA ESCURO: Fundo geral e cores de texto principais */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #121824; padding-bottom: 40px; color: #f1f5f9; }
        .container { max-width: 500px; margin: auto; padding: 15px; box-sizing: border-box; margin-top: 10px; }
        
        /* Topo adaptado para o tema escuro */
        .topo { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-bottom: 20px; border: 1px solid #334155; }
        .logo-topo { flex: 1; display: flex; justify-content: flex-start; }
        .logo-topo img { height: 30px; filter: drop-shadow(0px 0px 1px #fff); } /* Leve realce no logo se necessário */
        .titulo-topo { flex: 2; text-align: center; color: #38bdf8; font-size: 18px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        .reset-topo { flex: 1; text-align: right; color: #ef4444; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        /* Botões permanecem no mesmo tamanho, apenas com contraste ajustado */
        .btn-scan { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
        .btn-nf { background: #0f4c81; color: white; }
        .btn-os { background: #475569; color: white; }
        
        /* Botão manual mais visível no escuro */
        .btn-manual { background: #334155; color: #e2e8f0; padding: 8px; font-size: 13px; border: 1px solid #475569; border-radius: 6px; width: auto; display: inline-block; margin-top: 5px; font-weight: 600; cursor: pointer; }
        
        /* Badges de itens adicionados */
        .badge-container { background: #1e293b; padding: 10px; margin: 8px 0 15px 0; border-radius: 8px; border: 1px dashed #38bdf8; min-height: 45px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-item { background: #0f4c81; color: white; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-excluir-item { color: #f87171; font-weight: 900; font-size: 14px; }
        
        /* Títulos de seção em cor clara e nítida */
        .secao-titulo { font-size: 14px; font-weight: bold; color: #94a3b8; margin-top: 15px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* CAMPOS DE INPUT: Fundo escuro mais claro que o fundo geral e fontes brancas */
        input { width: 100%; padding: 15px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #ffffff; font-size: 16px; box-sizing: border-box; }
        input::placeholder { color: #94a3b8; } /* Cor do texto de ajuda interna */
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        
        /* Área de Assinatura com fundo branco mantido para contraste do traço preto */
        #assinatura { border: 2px solid #38bdf8; width: 100%; height: 200px; background: white; border-radius: 10px; margin-top: 10px; touch-action: none; }
        
        .btnSalvar { background: #22c55e; color: white; margin-top: 30px; font-size: 18px; font-weight: bold; }
        
        /* Feedback visual da foto da OS consultada */
        .box-link-foto { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #475569; margin-top: 12px; text-align: center; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
        .btn-abrir-foto { display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 8px; box-shadow: 0 2px 5px rgba(2,132,199,0.3); }
        .loading-foto { font-size: 12px; color: #94a3b8; font-style: italic; margin-top: 5px; display: none; }

        /* ==========================================================================
           LAYOUT: CÂMERA OCUPAR TELA INTEIRA PADRONIZADO
           ========================================================================== */
        #scannerTela { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            display: none; 
            z-index: 9999; 
            overflow: hidden;
        }
        
        #reader { 
            width: 100% !important; 
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        #reader video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        #reader img, #reader span, #reader div:not(#reader__scan_region) {
            display: none !important;
        }

        #reader #reader__scan_region {
            display: block !important;
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .linha-guia { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 85%; 
            height: 2px; 
            background: rgba(255, 0, 0, 0.7); 
            transform: translate(-50%, -50%); 
            z-index: 10000; 
            pointer-events: none; 
        }

        .btn-fechar-camera-suspensa {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            z-index: 10005; 
            background: #dc2626; 
            color: white; 
            padding: 14px 28px; 
            border-radius: 8px; 
            border: none; 
            font-weight: bold; 
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topo">
        <div class="logo-topo"><img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png"></div>
        <div class="titulo-topo">Canhoto Digital</div>
        <div class="reset-topo" onclick="location.reload(true)">Reset</div>
    </div>

    <label class="secao-titulo">1. Notas Fiscais</label>
    <button class="btn-scan btn-nf" onclick="abrirScanner('NF')">📷 ESCANEAR NOTA FISCAL</button>
    <div class="btn-manual" onclick="addManual('NF')">+ Digitar NF Manualmente</div>
    <div class="badge-container" id="contNF"></div>

    <label class="secao-titulo">2. Identificação do Recebedor</label>
    <input id="recebedor" type="text" placeholder="Nome Completo de quem recebeu">
    <input id="rgcpf" type="tel" placeholder="CPF (Apenas números)" maxlength="14" oninput="mascaraCPF(this)">

    <label class="secao-titulo">3. Assinatura Digital</label>
    <canvas id="assinatura"></canvas>
    <button style="background:none; color:#f87171; text-decoration:underline; font-size:12px; width:auto; padding:5px; border:none; cursor:pointer;" onclick="limparAss()">Limpar Assinatura</button>

    <label class="secao-titulo">4. Ordens de Serviço (OS)</label>
    <button class="btn-scan btn-os" onclick="abrirScanner('OS')">📷 ESCANEAR ORDEM SERVIÇO</button>
    <div class="btn-manual" onclick="addManual('OS')">+ Digitar OS Manualmente</div>
    <div class="badge-container" id="contOS"></div>

    <div id="loadingFoto" class="loading-foto">⏳ Verificando imagem no recebimento...</div>
    <div id="boxLinkRecebimento" class="box-link-foto">
        <span style="font-size: 13px; font-weight: bold; color: #cbd5e1; display: block;">📸 Foto de Entrada Encontrada!</span>
        <a id="btnLinkFoto" href="#" target="_blank" class="btn-abrir-foto">👁️ VER FOTO DO RECEBIMENTO</a>
    </div>

    <label class="secao-titulo">5. Expedição</label>
    <input id="expedidor" type="text" placeholder="Nome do Expedidor">
    <button class="btn-scan btnSalvar" id="btnSalvar" onclick="salvar()">SALVAR</button>
</div>

<div id="scannerTela">
    <div id="reader"></div>
    <div class="linha-guia"></div>
    <button onclick="fecharScanner()" class="btn-fechar-camera-suspensa">FECHAR</button>
</div>

<script>
let scanner;
let listaNF = [];
let listaOS = [];
let destino = 'NF';
let assinou = false;

const apiUrl = "https://script.google.com/macros/s/AKfycbxw42iHfUghqkeunSGbU5syHFXJGsTHHvNT5GXm56jXOV-UPdlnebvxjxPvsIsbwcccxA/exec";

function mascaraCPF(i) {
    let v = i.value.replace(/\D/g, "");
    if (v.length > 11) v = v.slice(0, 11);
    i.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}

function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g, '');
    if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
    let add = 0;
    for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
    let rev = 11 - (add % 11);
    if (rev == 10 || rev == 11) rev = 0;
    if (rev != parseInt(cpf.charAt(9))) return false;
    add = 0;
    for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
    rev = 11 - (add % 11);
    if (rev == 10 || rev == 11) rev = 0;
    if (rev != parseInt(cpf.charAt(10))) return false;
    return true;
}

function abrirScanner(tipo) {
    destino = tipo;
    document.getElementById("scannerTela").style.display = "block";
    scanner = new Html5Qrcode("reader");
    
    const configuracaoLeitor = { 
        fps: 30, 
        qrbox: tipo === 'NF' ? undefined : 260,
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.QR_CODE
        ]
    };
    
    scanner.start(
        { facingMode: "environment" }, 
        configuracaoLeitor, 
        (codigo) => {
            let n = codigo.replace(/\D/g, '');
            let num = n;
            
            // FILTRO BLINDADO DA DANFE: Se for NF e contiver a chave completa (44 dígitos), extrai o número
            if (tipo === 'NF') {
                if (n.length >= 44) {
                    num = n.substring(25, 34);
                } else if (n.length >= 9) {
                    num = n.slice(-10, -1); 
                }
            }
            
            // Remove zeros à esquerda desnecessários do número filtrado para exibição limpa
            if (tipo === 'NF') {
                num = parseInt(num, 10).toString();
            }
            
            adicionarValor(num);
            fecharScanner();
        },
        (erro) => {}
    ).catch(() => { alert("Câmera não disponível."); });
}

function fecharScanner() {
    if (scanner) {
        scanner.stop().then(() => { document.getElementById("scannerTela").style.display = "none"; }).catch(() => {
            document.getElementById("scannerTela").style.display = "none";
        });
    } else {
        document.getElementById("scannerTela").style.display = "none";
    }
}

function addManual(tipo) {
    destino = tipo;
    let n = prompt(tipo === 'NF' ? "Digite o número da NF:" : "Digite a Identificação da OS:");
    if (n) {
        let valor = (tipo === 'NF') ? n.replace(/\D/g, '') : n.trim();
        adicionarValor(valor);
    }
}

function adicionarValor(val) {
    if (!val) return;
    if (destino === 'NF') { 
        if (!listaNF.includes(val)) listaNF.push(val); 
    } else { 
        if (!listaOS.includes(val)) {
            listaOS.push(val);
            buscarFotoDoRecebimento(val);
        }
    }
    atualizarExibicao();
}

function removerItem(tipo, val) {
    if (tipo === 'NF') { 
        listaNF = listaNF.filter(i => i !== val); 
    } else { 
        listaOS = listaOS.filter(i => i !== val); 
        if(listaOS.length === 0) {
            ocultarBoxFoto();
        } else {
            buscarFotoDoRecebimento(listaOS[listaOS.length - 1]);
        }
    }
    atualizarExibicao();
}

function atualizarExibicao() {
    document.getElementById('contNF').innerHTML = listaNF.map(i => `<div class="badge-item" onclick="removerItem('NF', '${i}')">NF: ${i} <span class="btn-excluir-item">X</span></div>`).join('');
    document.getElementById('contOS').innerHTML = listaOS.map(i => `<div class="badge-item" onclick="removerItem('OS', '${i}')">OS: ${i} <span class="btn-excluir-item">X</span></div>`).join('');
}

function ocultarBoxFoto() {
    document.getElementById("boxLinkRecebimento").style.display = "none";
    document.getElementById("btnLinkFoto").href = "#";
    document.getElementById("loadingFoto").style.display = "none";
}

async function buscarFotoDoRecebimento(numeroOS) {
    if (!numeroOS) return;
    
    const loader = document.getElementById("loadingFoto");
    const boxLink = document.getElementById("boxLinkRecebimento");
    const btnFoto = document.getElementById("btnLinkFoto");

    loader.style.display = "block";

    try {
        const resposta = await fetch(apiUrl, {
            method: "POST",
            body: JSON.stringify({ tipo: "BUSCAR_OS", os: numeroOS })
        });
        const dados = await resposta.json();

        loader.style.display = "none";

        if (dados.sucesso && dados.linkFoto && dados.linkFoto !== "Sem foto") {
            btnFoto.href = dados.linkFoto;
            boxLink.style.display = "block";
        } else {
            ocultarBoxFoto();
        }
    } catch (err) {
        loader.style.display = "none";
    }
}

const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");
function ajustarCanvas() { canvas.width = canvas.offsetWidth; canvas.height = 200; }
window.addEventListener("load", ajustarCanvas);

let desenhando = false;
function obterPosicao(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
}

function iniciar(e) { e.preventDefault(); desenhando = true; assinou = true; ctx.beginPath(); const p = obterPosicao(e); ctx.moveTo(p.x, p.y); }
function mover(e) { if (!desenhando) return; e.preventDefault(); const p = obterPosicao(e); ctx.lineTo(p.x, p.y); ctx.lineWidth = 3; ctx.stroke(); }

canvas.addEventListener("touchstart", iniciar, {passive: false});
canvas.addEventListener("touchmove", mover, {passive: false});
canvas.addEventListener("touchend", () => desenhando = false);
canvas.addEventListener("mousedown", iniciar);
canvas.addEventListener("mousemove", mover);
window.addEventListener("mouseup", () => desenhando = false);

function limparAss() { ctx.clearRect(0, 0, canvas.width, canvas.height); assinou = false; }

function salvar() {
    const r = document.getElementById("recebedor").value.trim();
    const d = document.getElementById("rgcpf").value.trim();
    const x = document.getElementById("expedidor").value.trim();

    if (r.split(' ').filter(word => word.length > 0).length < 2) { alert("⚠️ Digite o NOME COMPLETO de quem recebeu."); return; }
    if (!validarCPF(d)) { alert("⚠️ CPF INVÁLIDO."); return; }
    if (!r || !d || !x || listaNF.length === 0 || listaOS.length === 0 || !assinou) { alert("⚠️ Preencha todos os campos."); return; }

    const btn = document.getElementById("btnSalvar");
    btn.disabled = true;
    btn.innerText = "ENVIANDO...";

    const payload = {
        notas: listaNF,
        ordens: listaOS,
        recebedor: r,
        documento: d,
        expedidor: x,
        assinatura: canvas.toDataURL("image/png")
    };

    fetch(apiUrl, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
    })
    .then(() => {
        alert("✅ Canhoto enviado com sucesso!");
        location.reload(true);
    })
    .catch(err => {
        console.error(err);
        alert("❌ Erro na conexão.");
        btn.disabled = false;
        btn.innerText = "SALVAR";
    });
}
</script>
</body>
</html>
