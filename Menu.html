<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Menu Principal - Danuta</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 180px;
            margin-bottom: 30px;
        }
        h1 {
            color: #0f4c81;
            font-size: 24px;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 25px 0;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-expedicao { background-color: #2563eb; } /* Azul */
        .btn-qualidade { background-color: #059669; } /* Verde */
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo">
        <h1>Sistema de Controle</h1>

        <a href="index.html" class="btn btn-expedicao">📦 EXPEDIÇÃO</a>

        <a href="qualidade.html" class="btn btn-qualidade">✅ QUALIDADE</a>
    </div>

</body>
</html>
