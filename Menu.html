<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: #0f4c81;
      margin-bottom: 30px;
    }

    .menu-button {
      width: 100%;
      padding: 20px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .btn-expedicao { background-color: #2563eb; }
    .btn-qualidade { background-color: #059669; }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://raw.githubusercontent.com/galvanicadanuta1-ai/canhoto-digital/main/logo.png" class="logo" alt="Logo">
    <h1>Controle Danuta</h1>

    <button class="menu-button btn-expedicao" onclick="navegar('index')">
      📦 Expedição (Canhoto)
    </button>

    <button class="menu-button btn-qualidade" onclick="navegar('qualidade')">
      ✅ Qualidade
    </button>
  </div>

  <script>
    function navegar(pagina) {
      // Esta função vai chamar o servidor para carregar a nova página
      google.script.run.withSuccessHandler(function(url) {
        window.open(url, '_top');
      }).getRoute(pagina);
    }
  </script>

</body>
</html>
